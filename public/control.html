<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Harvest Game Main</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <link rel="icon" href="favicon.ico" type="image/ico" >

</head>
<body class="bg-light text-center">
    <h1>Apple Harvest Game</h1>
    <p>Select a version:</p>

    <div class="container" style="max-width: 420px;">
        <label for="layoutSelect" class="form-label">Layout variant</label>
        <select id="layoutSelect" class="form-select mb-1">
            <option value="classic" selected>Classic (standard)</option>
            <option value="upper">Upper playground (premium upper zone)</option>
            <option value="teams">Teams (blue / orange)</option>
            <option value="corners">Corners (2 orchards + 2 lakes)</option>
            <option value="teams_corners">Teams + Corners (pairs on the corners map)</option>
        </select>
        <div id="layoutDesc" class="text-muted mb-3" style="font-size:0.82rem;"></div>
    </div>

    <div class="container" style="max-width: 420px;">
        <label for="groupSize" class="form-label">Group size</label>
        <select id="groupSize" class="form-select mb-3">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
        </select>
    </div>

    <div class="container" style="max-width: 420px;">
        <label for="coopW" class="form-label">Coop sensitivity (COOP_W)</label>
        <input type="number" id="coopW" class="form-control mb-1" value="0.05" min="0.001" max="1" step="0.005">
        <div class="text-muted mb-3" style="font-size:0.82rem;">Lower = drop/stain appear and disappear more slowly. Default 0.05.</div>
    </div>

    <div class="container" style="max-width: 420px;">
        <label for="pBall" class="form-label">Ball spawn probability (P_ball)</label>
        <input type="number" id="pBall" class="form-control mb-1" value="0.6" min="0" max="1" step="0.01">
        <div class="text-muted mb-3" style="font-size:0.82rem;">Chance each second a new ball (dirt) spawns in the main playground. Default 0.6.</div>
    </div>

    <div class="container" style="max-width: 420px;">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="testMode">
            <label class="form-check-label" for="testMode">Test mode</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="testDurationWrap">
        <label for="testDuration" class="form-label">Test duration (seconds)</label>
        <input type="number" id="testDuration" class="form-control mb-3" value="10" min="1">
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="skipConsentWrap">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="skipConsent">
            <label class="form-check-label" for="skipConsent">Skip consent</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="skipTutorialWrap">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="skipTutorial">
            <label class="form-check-label" for="skipTutorial">Skip tutorial</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="jumpSurveyWrap">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="jumpSurvey">
            <label class="form-check-label" for="jumpSurvey">Jump to post-game survey</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="jumpSiasWrap">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="jumpSias">
            <label class="form-check-label" for="jumpSias">Jump to SIAS</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="skipSiasWrap">
        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="skipSias">
            <label class="form-check-label" for="skipSias">Skip SIAS</label>
        </div>
    </div>

    <div class="container" style="max-width: 420px; display: none;" id="tutorialStartWrap">
        <label for="tutorialStart" class="form-label">Tutorial start page</label>
        <select id="tutorialStart" class="form-select mb-3">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select>
    </div>

    <div class="container" style="max-width: 420px;">
        <label for="prolificCode" class="form-label">Prolific Code</label>
        <input type="text" id="prolificCode" class="form-control mb-3" placeholder="Enter Prolific Code">
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-warning" data-mode="none">None</button>
        <button class="btn btn-primary" data-mode="punish">Punishment</button>
        <button class="btn btn-success" data-mode="praise">Praise</button>
        <button class="btn btn-info" data-mode="water">Water</button>
        <button class="btn btn-danger" data-mode="waterPunish">Water + Punishment</button>
        <button class="btn btn-teal" data-mode="waterPraise" style="background-color:#20c997; color:white;">Water + Praise</button>
        <button class="btn btn-secondary" data-mode="stain">Stain</button>
        <button class="btn btn-dark" data-mode="stainPunish">Stain + Punishment</button>
        <button class="btn btn-secondary" data-mode="stainPraise" style="background-color:#6f42c1; color:white;">Stain + Praise</button>
        <button class="btn btn-secondary" data-mode="waterStain" style="background-color:#0d6efd; color:white;">Water + Stain</button>
        <button class="btn btn-secondary" data-mode="waterStainPunish" style="background-color:#842029; color:white;">Water + Stain + Punishment</button>
        <button class="btn btn-secondary" data-mode="waterStainPraise" style="background-color:#146c43; color:white;">Water + Stain + Praise</button>
    </div>

    <script>
        const layoutSelect = document.getElementById("layoutSelect");
        const layoutDesc  = document.getElementById("layoutDesc");
        const layoutDescriptions = {
            classic: "One river (right) and one orchard (left). Standard layout.",
            upper:   "Two stacked playgrounds. The upper zone is more productive (higher apple & dirt spawn rates). Players move freely between them.",
            teams:   "Players are split into a Blue team and an Orange team. Each team is encouraged to specialise: one player harvests apples, the other cleans.",
            corners: "Two orchards (top-left / bottom-left) and two lakes (top-right / bottom-right) at the corners of the grid.",
            teams_corners: "Teams (Blue / Orange pairs) played on the corners map: two orchards and two lakes placed diagonally at the corners."
        };
        function updateLayoutDesc() {
            layoutDesc.textContent = layoutDescriptions[layoutSelect.value] || "";
        }
        layoutSelect.addEventListener("change", updateLayoutDesc);
        updateLayoutDesc();

        const groupSizeSelect = document.getElementById("groupSize");
        const testModeCheckbox = document.getElementById("testMode");
        const skipTutorialWrap = document.getElementById("skipTutorialWrap");
        const skipTutorialCheckbox = document.getElementById("skipTutorial");
        const skipConsentWrap = document.getElementById("skipConsentWrap");
        const skipConsentCheckbox = document.getElementById("skipConsent");
        const tutorialStartWrap = document.getElementById("tutorialStartWrap");
        const tutorialStartSelect = document.getElementById("tutorialStart");
        const jumpSurveyWrap = document.getElementById("jumpSurveyWrap");
        const jumpSurveyCheckbox = document.getElementById("jumpSurvey");
        const jumpSiasWrap = document.getElementById("jumpSiasWrap");
        const jumpSiasCheckbox = document.getElementById("jumpSias");
        const skipSiasWrap = document.getElementById("skipSiasWrap");
        const skipSiasCheckbox = document.getElementById("skipSias");
        const testDurationWrap = document.getElementById("testDurationWrap");
        const testDurationInput = document.getElementById("testDuration");

        function updateTutorialOptionsVisibility() {
            const isTest = testModeCheckbox.checked;
            const skip = skipTutorialCheckbox.checked;
            testDurationWrap.style.display = isTest ? "block" : "none";
            skipTutorialWrap.style.display = isTest ? "block" : "none";
            skipConsentWrap.style.display = isTest ? "block" : "none";
            jumpSurveyWrap.style.display = isTest ? "block" : "none";
            jumpSiasWrap.style.display = isTest ? "block" : "none";
            skipSiasWrap.style.display = isTest ? "block" : "none";
            tutorialStartWrap.style.display = isTest && !skip ? "block" : "none";
        }

        testModeCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        skipTutorialCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        skipConsentCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        jumpSurveyCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        jumpSiasCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        skipSiasCheckbox.addEventListener("change", updateTutorialOptionsVisibility);
        updateTutorialOptionsVisibility();

        skipTutorialCheckbox.addEventListener("change", () => {
            if (skipTutorialCheckbox.checked) {
                skipConsentCheckbox.checked = true;
                skipConsentCheckbox.disabled = true;
            } else {
                skipConsentCheckbox.disabled = false;
            }
        });

        jumpSurveyCheckbox.addEventListener("change", () => {
            if (jumpSurveyCheckbox.checked) {
                skipConsentCheckbox.checked = true;
                skipConsentCheckbox.disabled = true;
                skipTutorialCheckbox.checked = true;
                skipTutorialCheckbox.disabled = true;
                tutorialStartWrap.style.display = "none";
                jumpSiasCheckbox.checked = false;
                jumpSiasCheckbox.disabled = true;
            } else {
                skipTutorialCheckbox.disabled = false;
                skipConsentCheckbox.disabled = !skipTutorialCheckbox.checked;
                jumpSiasCheckbox.disabled = false;
                updateTutorialOptionsVisibility();
            }
        });

        jumpSiasCheckbox.addEventListener("change", () => {
            if (jumpSiasCheckbox.checked) {
                skipConsentCheckbox.checked = true;
                skipConsentCheckbox.disabled = true;
                skipTutorialCheckbox.checked = true;
                skipTutorialCheckbox.disabled = true;
                tutorialStartWrap.style.display = "none";
                jumpSurveyCheckbox.checked = false;
                jumpSurveyCheckbox.disabled = true;
                skipSiasCheckbox.checked = false;
                skipSiasCheckbox.disabled = true;
            } else {
                skipTutorialCheckbox.disabled = false;
                skipConsentCheckbox.disabled = !skipTutorialCheckbox.checked;
                jumpSurveyCheckbox.disabled = false;
                skipSiasCheckbox.disabled = false;
                updateTutorialOptionsVisibility();
            }
        });

        skipSiasCheckbox.addEventListener("change", () => {
            if (skipSiasCheckbox.checked) {
                jumpSiasCheckbox.checked = false;
                jumpSiasCheckbox.disabled = true;
            } else {
                jumpSiasCheckbox.disabled = false;
            }
        });

        document.querySelectorAll("button[data-mode]").forEach((btn) => {
            btn.addEventListener("click", () => {
                const mode = btn.getAttribute("data-mode");
                const selectedLayout = layoutSelect.value;
                const groupSize = groupSizeSelect.value;
                const prolificCode = document.getElementById("prolificCode").value.trim();
                const testMode = testModeCheckbox.checked ? "true" : "false";
                const tutorialStart = tutorialStartSelect.value;
                const skipTutorial = skipTutorialCheckbox.checked ? "true" : "false";
                const skipConsent = skipConsentCheckbox.checked ? "true" : "false";
                const jumpSurvey = jumpSurveyCheckbox.checked ? "true" : "false";
                const jumpSias = jumpSiasCheckbox.checked ? "true" : "false";
                const skipSias = skipSiasCheckbox.checked ? "true" : "false";
                const tutorialParam = testMode === "true" && skipTutorial === "false"
                    ? `&tutorialStart=${tutorialStart}`
                    : "";
                const testDuration = testDurationInput.value;
                const skipParam = testMode === "true"
                    ? `&skipTutorial=${skipTutorial}&skipConsent=${skipConsent}&jumpSurvey=${jumpSurvey}&jumpSias=${jumpSias}&skipSias=${skipSias}&testDuration=${testDuration}`
                    : "";
                const layoutParam = selectedLayout !== "classic" ? `&layout=${selectedLayout}` : "";
                const coopW = document.getElementById("coopW").value;
                const coopWParam = coopW ? `&coopW=${coopW}` : "";
                const pBall = document.getElementById("pBall").value;
                const pBallParam = pBall ? `&pBall=${pBall}` : "";
                window.location.href = `/?mode=${mode}&groupSize=${groupSize}&test=${testMode}${layoutParam}${skipParam}${tutorialParam}${coopWParam}${pBallParam}`;
            });
        });
    </script>
</body>
</html>
